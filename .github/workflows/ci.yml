name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build packages
        run: pnpm build

      - name: Bundle Android app the same way EAS does
        working-directory: apps/mobile
        run: pnpm exec expo export --platform android --output-dir /tmp/guardian-android-export

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  android-compile:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package is the action default and no longer exists.
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125

      - name: Install dependencies
        run: pnpm install

      - name: Build workspace packages
        run: pnpm --filter @guardian/shared build && pnpm --filter @guardian/ui build && pnpm --filter @guardian/risk-engine build && pnpm --filter @guardian/simulator build

      - name: Build installable Android APK
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_DEV_SIMULATOR: 'false'
          EXPO_PUBLIC_API_URL: https://guard-app-pe2n.onrender.com
          NODE_ENV: production
        run: ./gradlew :app:assembleRelease --no-daemon -x lint

      - name: Collect APK
        run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk guardian.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: guardian-android
          path: guardian.apk
          if-no-files-found: error

      - name: Publish APK on GitHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          tag: android-latest
          name: Android APK
          allowUpdates: true
          replacesArtifacts: true
          artifacts: guardian.apk
          body: |
            Installable Android APK from the latest main commit.
            On the phone, allow installation from unknown sources, then open this file.
          token: ${{ secrets.GITHUB_TOKEN }}
